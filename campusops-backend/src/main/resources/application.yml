# =============================================
# CampusOps AI — Application Configuration
# =============================================

spring:
  application:
    name: CampusOps AI

  # --- Database ---
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusops}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Thymeleaf ---
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  # --- Jackson ---
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

  # --- Mail (optional) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# --- Server ---
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

# --- JWT ---
app:
  jwt:
    secret: ${JWT_SECRET:campusops-ai-secret-key-must-be-at-least-256-bits-long-for-hs256}
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # --- AI ---
  ai:
    provider: ${AI_PROVIDER:fallback}  # gemini, openai, fallback
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-pro
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini

  # --- WhatsApp ---
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}  # mock, twilio, meta
    meta:
      token: ${META_WHATSAPP_TOKEN:}
      phone-number-id: ${META_PHONE_NUMBER_ID:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

  # --- Python Worker ---
  worker:
    base-url: ${WORKER_URL:http://localhost:5000}

  # --- Demo Mode & Seeding ---
  demo:
    enabled: ${DEMO_MODE:true}
    seed-data: ${SEED_DATA:true}
    admin-email: ${ADMIN_EMAIL:admin@campusops.ai}
    admin-password: ${ADMIN_PASSWORD:password}

# --- Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# --- Logging ---
logging:
  level:
    com.campusops: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
