<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main-layout}">
<head>
    <title>Page Not Found - CampusOps AI</title>
</head>
<body>

<div layout:fragment="content" class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="text-center glass-card p-5" style="max-width: 500px;">
        <i class="bi bi-search text-muted mb-3" style="font-size: 4rem;"></i>
        <h1 class="fw-bold mb-3">404 - Not Found</h1>
        <p class="text-muted mb-4" th:text="${message ?: 'The page or resource you are looking for does not exist.'}"></p>
        <a th:href="@{/dashboard}" class="btn btn-outline-light px-4">Return to Dashboard</a>
    </div>
</div>

</body>
</html>
