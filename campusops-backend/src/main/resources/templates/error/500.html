<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main-layout}">
<head>
    <title>System Error - CampusOps AI</title>
</head>
<body>

<div layout:fragment="content" class="d-flex align-items-center justify-content-center" style="min-height: 70vh;">
    <div class="text-center glass-card p-5" style="max-width: 600px;">
        <i class="bi bi-exclamation-triangle text-danger mb-3" style="font-size: 4rem;"></i>
        <h1 class="fw-bold mb-3">500 - System Error</h1>
        <p class="text-muted mb-4">An unexpected error occurred while processing your request. Our engineering team has been notified.</p>
        
        <div th:if="${message}" class="text-start bg-dark p-3 rounded mb-4 overflow-auto" style="max-height: 200px; font-size: 0.8rem;">
            <pre class="text-muted mb-0" th:text="${message}"></pre>
        </div>
        
        <a th:href="@{/dashboard}" class="btn btn-outline-light px-4">Return to Dashboard</a>
    </div>
</div>

</body>
</html>
