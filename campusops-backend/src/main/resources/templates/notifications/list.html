<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main-layout}">
<head>
    <title>Notifications - CampusOps AI</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1 text-main">Notifications</h4>
            <p class="text-muted small mb-0">Your recent alerts and system messages.</p>
        </div>
        <button class="btn btn-sm btn-light">Mark all as read</button>
    </div>

    <div class="glass-card shadow-sm p-0">
        <div th:replace="~{fragments/components :: emptyState('All caught up', 'You have no new notifications.', 'bi-bell-slash text-muted')}"></div>
    </div>
</div>

</body>
</html>
