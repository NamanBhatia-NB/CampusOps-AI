<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusOps AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-wrapper">

    <div class="auth-card animate-fade-in" style="max-width: 450px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow-lg" style="width: 64px; height: 64px;">
                <i class="bi bi-person-plus-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-main">Create Account</h3>
            <p class="text-muted small">Join CampusOps AI</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="fullName" name="fullName" placeholder="John Doe" required autofocus>
                <label for="fullName">Full Name</label>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" minlength="8" required>
                <label for="password">Password (min. 8 chars)</label>
            </div>
            
            <button class="btn btn-gradient w-100 py-2 mb-3 fw-semibold" type="submit">Sign Up</button>
            
            <div class="text-center mt-3 mb-4">
                Already have an account? <a th:href="@{/login}" class="text-decoration-none fw-semibold text-primary">Log in</a>
            </div>

            <div class="text-center text-muted small mt-4 pt-3 border-top">
                CampusOps AI v1.0 &copy; 2026<br>
                By signing up, you agree to our Terms of Service.
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
