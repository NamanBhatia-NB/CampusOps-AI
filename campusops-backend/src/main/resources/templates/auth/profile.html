<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main-layout}">
<head>
    <title>My Profile - CampusOps AI</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1 text-main">My Profile</h4>
            <p class="text-muted small mb-0">Manage your account settings and preferences.</p>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="glass-card shadow-sm p-4 text-center">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
                    <span th:text="${#authentication.name.substring(0,1).toUpperCase()}" th:if="${#authentication.name != 'anonymousUser'}">U</span>
                </div>
                <h5 class="fw-bold mb-1" th:text="${#authentication.name}">User</h5>
                <p class="text-muted small mb-0">Administrator</p>
            </div>
        </div>
        <div class="col-md-8">
            <div class="glass-card shadow-sm p-4">
                <h6 class="fw-semibold text-main mb-4">Personal Information</h6>
                <form>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Email Address</label>
                            <input type="email" class="form-control bg-light border-secondary" th:value="${#authentication.name}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted small">Role</label>
                            <input type="text" class="form-control bg-light border-secondary" value="System Administrator" readonly>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
