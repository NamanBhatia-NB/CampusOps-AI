<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - CampusOps AI">CampusOps AI</title>
    
    <!-- CSRF tokens for AJAX -->
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf != null}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf != null}"/>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- Extra Head Content -->
    <th:block layout:fragment="head"></th:block>
</head>
<body>

<div class="app-wrapper">
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-layers-fill"></i>
            <span>CampusOps AI</span>
        </div>
        
        <div class="sidebar-menu">
            <div class="menu-section">Main</div>
            <a th:href="@{/dashboard}" class="menu-item" th:classappend="${currentUri == '/dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i>
                <span>Dashboard</span>
            </a>
            
            <div class="menu-section">CRM</div>
            <a th:href="@{/leads}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/leads') ? 'active' : ''}">
                <i class="bi bi-people-fill"></i>
                <span>Leads</span>
            </a>
            <a th:href="@{/conversations}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/conversations') ? 'active' : ''}">
                <i class="bi bi-chat-dots-fill"></i>
                <span>Conversations</span>
            </a>
            <a th:href="@{/tasks}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/tasks') ? 'active' : ''}">
                <i class="bi bi-check2-square"></i>
                <span>Tasks</span>
            </a>
            
            <div class="menu-section">Automation & AI</div>
            <a th:href="@{/automation}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/automation') ? 'active' : ''}">
                <i class="bi bi-robot"></i>
                <span>Automation Rules</span>
            </a>
            
            <div class="menu-section">Reports</div>
            <a th:href="@{/analytics}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/analytics') ? 'active' : ''}">
                <i class="bi bi-bar-chart-fill"></i>
                <span>Analytics</span>
            </a>
            
            <div class="menu-section" sec:authorize="hasRole('ADMIN')">Settings</div>
            <a th:href="@{/admin/users}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/admin/users') ? 'active' : ''}" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-person-badge"></i>
                <span>Team</span>
            </a>
            <a th:href="@{/admin/integrations}" class="menu-item" th:classappend="${currentUri != null && #strings.startsWith(currentUri, '/admin/integrations') ? 'active' : ''}" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-plug-fill"></i>
                <span>Integrations</span>
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <div class="d-flex align-items-center">
                <button id="sidebar-toggle" class="btn btn-link text-body p-0 me-3">
                    <i class="bi bi-list fs-4"></i>
                </button>
                <!-- Global Search -->
                <form th:action="@{/leads}" method="get" class="position-relative d-none d-md-block" style="width: 300px;">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" name="search" class="form-control bg-transparent border-secondary ps-5 rounded-pill" placeholder="Search leads...">
                </form>
            </div>
            
            <div class="d-flex align-items-center gap-3">

                <div class="dropdown">
                    <button class="btn btn-link text-body p-0 position-relative" data-bs-toggle="dropdown">
                        <i class="bi bi-bell fs-5"></i>
                        <span id="notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                            0
                        </span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow p-0 glass-card" style="width: 300px; max-height: 400px; overflow-y: auto;">
                        <li class="p-3 border-bottom"><strong class="small text-uppercase">Notifications</strong></li>
                        <li><div class="p-3 text-center text-muted small">No new notifications</div></li>
                        <li class="p-2 border-top text-center"><a href="/notifications" class="small text-decoration-none">View All</a></li>
                    </ul>
                </div>
                
                <div class="dropdown ms-2">
                    <a href="#" class="d-flex align-items-center text-decoration-none text-body dropdown-toggle" data-bs-toggle="dropdown">
                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 32px; height: 32px;">
                            <span th:text="${#authentication.name.substring(0,1).toUpperCase()}" th:if="${#authentication.name != 'anonymousUser'}">U</span>
                            <span th:if="${#authentication.name == 'anonymousUser'}"><i class="bi bi-person"></i></span>
                        </div>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow glass-card">
                        <li><h6 class="dropdown-header" th:text="${#authentication.name}">user@example.com</h6></li>
                        <li><a class="dropdown-item" href="/profile"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Page Content -->
        <div class="content-wrapper animate-fade-in">
            <!-- Flash Messages container -->
            <div th:if="${success}" class="flash-message d-none" data-type="success" th:text="${success}"></div>
            <div th:if="${error}" class="flash-message d-none" data-type="error" th:text="${error}"></div>
            
            <div layout:fragment="content">
                <!-- Page content goes here -->
            </div>
        </div>
    </main>
</div>

<!-- Core Scripts -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>

<!-- Custom App Script -->
<script th:src="@{/js/app.js}"></script>

<!-- Extra Scripts -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Move all modals to body to prevent z-index and backdrop issues in Bootstrap
        document.querySelectorAll('.modal').forEach(modal => {
            document.body.appendChild(modal);
        });
    });
</script>
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
