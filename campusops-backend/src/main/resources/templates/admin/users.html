<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout/main-layout}">
<head>
    <title>Team Management - CampusOps AI</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-1 text-main">Team Members</h4>
            <p class="text-muted small mb-0">Manage counselors, managers, and system administrators.</p>
        </div>
        <button class="co-btn co-btn-primary" data-bs-toggle="modal" data-bs-target="#addMemberModal">
            <i class="bi bi-person-plus me-2"></i>Add Member
        </button>
    </div>

    <div class="glass-card shadow-sm p-0">
        <table class="table table-hover align-middle mb-0">
            <thead class="bg-light text-muted small text-uppercase">
                <tr>
                    <th class="ps-4">User</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th class="text-end pe-4">Actions</th>
                </tr>
            </thead>
            <tbody class="border-top-0">
                <tr th:each="user : ${users}">
                    <td class="ps-4 py-3">
                        <div class="d-flex align-items-center">
                            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;" th:text="${user.fullName.substring(0,1)}">U</div>
                            <div>
                                <h6 class="mb-0 fw-semibold text-main" th:text="${user.fullName}">Name</h6>
                                <p class="mb-0 small text-muted" th:text="${user.email}">email</p>
                            </div>
                        </div>
                    </td>
                    <td><span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle" th:text="${user.role}">Role</span></td>
                    <td><span class="badge bg-success-subtle text-success border border-success-subtle">Active</span></td>
                    <td class="text-end pe-4">
                        <button class="btn btn-sm btn-light rounded-circle" data-bs-toggle="modal" th:data-bs-target="'#editMemberModal-' + ${user.id}"><i class="bi bi-pencil"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Edit Member Modals -->
    <div th:each="user : ${users}" class="modal fade" th:id="'editMemberModal-' + ${user.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-light">
                    <h5 class="modal-title fw-bold text-main">Edit Team Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Full Name</label>
                            <input type="text" class="form-control bg-light border-secondary" name="fullName" th:value="${user.fullName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Role</label>
                            <select class="form-select bg-light border-secondary" name="role" required>
                                <option value="COUNSELOR" th:selected="${user.role == 'COUNSELOR'}">Counselor</option>
                                <option value="MANAGER" th:selected="${user.role == 'MANAGER'}">Manager</option>
                                <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">Administrator</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">New Password (optional)</label>
                            <input type="password" class="form-control bg-light border-secondary" name="password" placeholder="Leave blank to keep unchanged">
                        </div>
                        <div class="modal-footer border-light px-0 pb-0 mb-0">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add Member Modal -->
    <div class="modal fade" id="addMemberModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card">
                <div class="modal-header border-light">
                    <h5 class="modal-title fw-bold text-main">Add Team Member</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addMemberForm" th:action="@{/admin/users}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Full Name</label>
                            <input type="text" class="form-control bg-light border-secondary" name="fullName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Email</label>
                            <input type="email" class="form-control bg-light border-secondary" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Temporary Password</label>
                            <input type="password" class="form-control bg-light border-secondary" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small text-uppercase tracking-wide">Role</label>
                            <select class="form-select bg-light border-secondary" name="role" required>
                                <option value="COUNSELOR">Counselor</option>
                                <option value="MANAGER">Manager</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                        </div>
                        <div class="modal-footer border-light px-0 pb-0 mb-0">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Add Member</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
</th:block>

</body>
</html>
