name: CampusOps AI — CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================
  # Build and Test Spring Boot Backend
  # ============================================
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: campusops_test
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        working-directory: ./campusops-backend
        run: mvn clean verify -B
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: campusops_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: campusops-backend/target/surefire-reports/

  # ============================================
  # Lint and Test Python Worker
  # ============================================
  build-worker:
    name: Lint & Test Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: campusops-worker/requirements.txt

      - name: Install dependencies
        working-directory: ./campusops-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint with flake8
        working-directory: ./campusops-worker
        run: |
          flake8 worker/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 worker/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # ============================================
  # Build Docker Images
  # ============================================
  docker-build:
    name: Build Docker Images
    needs: [build-backend, build-worker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./campusops-backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/campusops-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/campusops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: ./campusops-worker
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/campusops-worker:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/campusops-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
